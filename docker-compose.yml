services:
  backend:
    build:
      context: ./backend
    container_name: devops-demo-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    networks:
      - devops-demo-net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: devops-demo-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

networks:
  devops-demo-net:
    external: true
